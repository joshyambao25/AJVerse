<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OurNest</title>
  <meta name="description" content="Money, plans, places and little moments — together.">
  <meta name="theme-color" content="#3B82F6">

  <!-- Apply light/dark before the page draws (no white flash) -->
  <script>
    try {
      var t = (JSON.parse(localStorage.getItem('ournest.prefs') || '{}').theme) || 'auto';
      var dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>

  <!-- Install as an app -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OurNest">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Map library (OpenStreetMap, no API key needed) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>

  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div id="offline" hidden>☁️ You're offline. Everything you add is saved and will sync when you're back online.</div>
  <div id="root"></div>
  <div id="modal" hidden></div>
  <div id="viewer" hidden></div>
  <div id="toast"></div>
  <!-- Hidden picker used by "Snap" buttons (opens the camera on phones) -->
  <input type="file" id="snapInput" accept="image/*" capture="environment" hidden>
  <noscript>Please turn on JavaScript to use OurNest.</noscript>
</body>
</html>
